  build:
    name: Build
    runs-on: ubuntu-latesttt
    needs: [test]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install

      - name: Compile TypeScript
        # BUG 10: tsc not installed, tsconfig.json doesn't exist
        # ACTUAL ERROR: "sh: 1: tsc: not found" Ã¢ÂÂ "command not found"
        # AEGIS PATTERN MATCH: "command not found" Ã¢ÂÂ category=environment
        run: tsc --project tsconfig.json --noEmit

      - name: Bundle
        # BUG 11: webpack not in package.json, webpack.config.js doesn't exist
        # ACTUAL ERROR: "Cannot find module 'webpack'"
        # AEGIS PATTERN MATCH: "cannot find module" Ã¢ÂÂ category=dependency
        run: npx webpack --config webpack.config.js --mode production

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          # BUG 12: dist/ never created because build failed
          path: ./dist/
          if-no-files-found: warn
          retention-days: 7
