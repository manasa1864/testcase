  test:
    name: Unit Tests
    runs-on: ubuntu-latesttt
    needs: [install, lint]   # BUG 3 (other side): lint needs test Ã¢ÂÂ circular deadlock

    strategy:
      fail-fast: false
      matrix:
        # BUG 6: Node 14 is EOL Ã¢ÂÂ GitHub Actions will reject or warn
        node-version: [14, 18, 20]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # BUG 7: npm install again Ã¢ÂÂ no lockfile
      # ACTUAL ERROR: "npm ERR! code ENOENT ... package-lock.json"
      - run: npm install

      - name: Run unit tests
        # BUG 8: wrong directory Ã¢ÂÂ folder is tests/ not test/
        # ACTUAL ERROR: "node:internal/modules/cjs/loader: Cannot find module"
        # AEGIS PATTERN MATCH: "cannot find module" Ã¢ÂÂ category=dependency/test
        working-directory: ./test
        run: node unit.js
        env:
          # BUG 9: undefined secret Ã¢ÂÂ empty string Ã¢ÂÂ app may error on auth
          # AEGIS PATTERN MATCH: "unauthorized" or "401" in any downstream log
          NODE_SECRET: ${{ secrets.NODE_SECRET }}

