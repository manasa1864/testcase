name: CI — Core Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ┌─────────────────────────────────────────────────────────────────────────────┐
# │  AEGIS AGENT PATTERNS TRIGGERED:                                            │
# │  ✦ dependency  →  "npm ERR!" / "Cannot find module"                         │
# │  ✦ environment →  "No such file or directory" / "command not found"         │
# │  ✦ test        →  test assertion failures                                   │
# │  ✦ build       →  "Syntax error" / "compilation error"                      │
# └─────────────────────────────────────────────────────────────────────────────┘

jobs:

  # ── JOB 1: install ────────────────────────────────────────────────────────────
  # AEGIS PATTERN: dependency — "npm ERR! can not find ... package-lock.json"
  # ─────────────────────────────────────────────────────────────────────────────
  install:
    name: Install Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # BUG 1: node-version must be a string — bare number causes setup failure
          node-version: 20

      - name: Install
        # BUG 2: npm ci requires package-lock.json which is not committed
        # ACTUAL ERROR AEGIS SEES: "npm ERR! code ENOENT ... package-lock.json"
        # AEGIS PATTERN MATCH: "npm err" → category=dependency
        run: npm ci

  # ── JOB 2: lint ───────────────────────────────────────────────────────────────
  # AEGIS PATTERN: environment — "command not found"
  # ─────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    needs: [test]            # BUG 3: circular — test needs lint, lint needs test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # BUG 4: No npm install — eslint binary does not exist
      # ACTUAL ERROR: "sh: 1: eslint: not found"
      # AEGIS PATTERN MATCH: "command not found" → category=environment
      - name: Run ESLint
        run: eslint src/ --ext .js --config .eslintrc.json

      # BUG 5: .eslintrc.json doesn't exist even if eslint were installed
      # ACTUAL ERROR: "No such file or directory: .eslintrc.json"
      # AEGIS PATTERN MATCH: "no such file or directory" → category=environment

  # ── JOB 3: test ───────────────────────────────────────────────────────────────
  # AEGIS PATTERN: test — "Cannot find module" / test assertion error
  # AEGIS PATTERN: dependency — "Cannot find module '../src/utils'"
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [install, lint]   # BUG 3 (other side): lint needs test → circular deadlock

    strategy:
      matrix:
        # BUG 6: Node 14 is EOL — GitHub Actions will reject or warn
        node-version: [14, 18, 20]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # BUG 7: npm ci again — no lockfile
      # ACTUAL ERROR: "npm ERR! code ENOENT ... package-lock.json"
      - run: npm ci

      - name: Run unit tests
        # BUG 8: wrong directory — folder is tests/ not test/
        # ACTUAL ERROR: "node:internal/modules/cjs/loader: Cannot find module"
        # AEGIS PATTERN MATCH: "cannot find module" → category=dependency/test
        working-directory: ./test
        run: node unit.js
        env:
          # BUG 9: undefined secret → empty string → app may error on auth
          # AEGIS PATTERN MATCH: "unauthorized" or "401" in any downstream log
          NODE_SECRET: ${{ secrets.NODE_SECRET }}

  # ── JOB 4: build ──────────────────────────────────────────────────────────────
  # AEGIS PATTERN: build — "Syntax error" / "No such file or directory"
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install

      - name: Compile TypeScript
        # BUG 10: tsc not installed, tsconfig.json doesn't exist
        # ACTUAL ERROR: "sh: 1: tsc: not found" → "command not found"
        # AEGIS PATTERN MATCH: "command not found" → category=environment
        run: tsc --project tsconfig.json --noEmit

      - name: Bundle
        # BUG 11: webpack not in package.json, webpack.config.js doesn't exist
        # ACTUAL ERROR: "Cannot find module 'webpack'"
        # AEGIS PATTERN MATCH: "cannot find module" → category=dependency
        run: npx webpack --config webpack.config.js --mode production

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          # BUG 12: dist/ never created because build failed
          path: ./dist/
          if-no-files-found: error
