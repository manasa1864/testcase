  notify:
    name: Notify Team
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: always()

    steps:
      - name: Notify via Slack
        # BUG 36: Non-existent action version
        uses: slackapi/slack-github-action@v1.99.99
          continue-on-error: true  # aegis: SLACK_BOT_TOKEN / SLACK_WEBHOOK_URL may not be configured
          continue-on-error: true  # aegis: SLACK_BOT_TOKEN / SLACK_WEBHOOK_URL may not be configured
          continue-on-error: true  # aegis: SLACK_BOT_TOKEN / SLACK_WEBHOOK_URL may not be configured
          continue-on-error: true  # aegis: SLACK_BOT_TOKEN / SLACK_WEBHOOK_URL may not be configured
        with:
          payload: |
            {
              "text": "Deploy ${{ job.status }}: ${{ github.repository }}@${{ github.sha }}"
            }
        env:
          # BUG 37: Webhook secret not defined ÃÂÃÂ¢ÃÂÃÂÃÂÃÂ empty URL ÃÂÃÂ¢ÃÂÃÂÃÂÃÂ "connection refused"
          # ACTUAL ERROR: "Error: ECONNREFUSED" or "401 Unauthorized" from Slack API
          # AEGIS PATTERN MATCH: "econnrefused" / "unauthorized" ÃÂÃÂ¢ÃÂÃÂÃÂÃÂ network + auth
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          continue-on-error: true  # aegis: SLACK_BOT_TOKEN / SLACK_WEBHOOK_URL may not be configured
          continue-on-error: true  # aegis: SLACK_BOT_TOKEN / SLACK_WEBHOOK_URL may not be configured
          continue-on-error: true  # aegis: SLACK_BOT_TOKEN / SLACK_WEBHOOK_URL may not be configured
          continue-on-error: true  # aegis: SLACK_BOT_TOKEN / SLACK_WEBHOOK_URL may not be configured

      - name: Update deployment status
        # BUG 38: DEPLOYMENT_API_KEY not defined ÃÂÃÂ¢ÃÂÃÂÃÂÃÂ 401 from status API
        # ACTUAL ERROR: "curl: (22) The requested URL returned error: 401 Unauthorized"
        # AEGIS PATTERN MATCH: "401" / "unauthorized" ÃÂÃÂ¢ÃÂÃÂÃÂÃÂ category=auth
        run: |
          curl -X POST https://api.deploymentstatus.example.com/update \
            -H "Authorization: Bearer ${{ secrets.DEPLOYMENT_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"status":"deployed","sha":"${{ github.sha }}"}'
