  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [memory-build]
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install

      - name: Run build:staging
        # BUG 32: Script doesn't exist in package.json
        # ACTUAL ERROR: "npm ERR! Missing script: build:staging"
        # AEGIS PATTERN MATCH: "npm err" ÃÂÃÂ¢ÃÂÃÂÃÂÃÂ category=dependency
        run: npm run build:staging

      - name: Health check before deploy
        # BUG 33: staging.example.internal is unreachable ÃÂÃÂ¢ÃÂÃÂÃÂÃÂ ECONNREFUSED
        # ACTUAL ERROR: "curl: (7) Failed to connect to staging.example.internal: Connection refused"
        # AEGIS PATTERN MATCH: "connection refused" / "econnrefused" ÃÂÃÂ¢ÃÂÃÂÃÂÃÂ category=network
        run: |
          curl --retry 3 --retry-delay 5 -f https://staging.example.internal/health \
            || echo "Health check failed: ECONNREFUSED"
          exit 1

      - name: Deploy via SSH
        # BUG 34: No SSH key configured ÃÂÃÂ¢ÃÂÃÂÃÂÃÂ will get permission denied
        # ACTUAL ERROR: "Permission denied (publickey)"
        # AEGIS PATTERN MATCH: "permission denied" ÃÂÃÂ¢ÃÂÃÂÃÂÃÂ category=auth
        run: |
          ssh -o StrictHostKeyChecking=no \
              -o ConnectTimeout=10 \
              deploy@staging.example.internal \
              "cd /app && git pull && npm install && pm2 restart app"

      - name: Wait for service
        # BUG 35: Service never starts (deploy failed) ÃÂÃÂ¢ÃÂÃÂÃÂÃÂ this will ETIMEDOUT
        # ACTUAL ERROR: "curl: (28) Operation timed out"
        # AEGIS PATTERN MATCH: "etimedout" / "network timeout" ÃÂÃÂ¢ÃÂÃÂÃÂÃÂ category=network
        run: |
          for i in {1..10}; do
            curl -f https://staging.example.internal/health && exit 0
            sleep 5
          done
          echo "Service failed to start: network timeout"
          exit 1

