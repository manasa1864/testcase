name: Docker & Release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [main]
    tags: ["v*"]

# âââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââ
# â  AEGIS AGENT PATTERNS TRIGGERED:                                            â
# â  â¦ docker  â  "docker error" / "image not found" / "registry"              â
# â  â¦ auth    â  "permission denied" / "unauthorized" / "403"                 â
# â  â¦ timeout â  "timed out" / "deadline exceeded"                             â
# âââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââ

permissions:
  contents: write
  issues: write

jobs:

  # ââ JOB 5: docker-build âââââââââââââââââââââââââââââââââââââââââââââââââââââââ
  # AEGIS PATTERN: docker â "image not found" / "docker error"
  # AEGIS PATTERN: auth   â "permission denied" / "unauthorized"
  # âââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââ
  docker-build:
    name: Docker Build & Push
    # BUG 13: Windows runner cannot run Docker commands
    # ACTUAL ERROR: "docker: command not found"
    # AEGIS PATTERN MATCH: "command not found" â category=environment
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          # BUG 14: Secrets not defined â Docker login gets empty credentials
          # ACTUAL ERROR: "Error response from daemon: unauthorized: incorrect username or password"
          # AEGIS PATTERN MATCH: "unauthorized" â category=auth
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          # BUG 15: Dockerfile doesn't exist in repo
          # ACTUAL ERROR: "failed to solve: failed to read dockerfile: open Dockerfile: no such file or directory"
          # AEGIS PATTERN MATCH: "docker.*error" + "no such file" â category=docker
          file: ./Dockerfile
          push: true
          # BUG 16: Invalid characters in Docker image tag
          # ACTUAL ERROR: "invalid tag format"
          tags: |
            myorg/aegis-app:latest@@SNAPSHOT
            myorg/aegis-app:${{ github.sha }}
          # BUG 17: Non-existent base image referenced in build-args
          # ACTUAL ERROR: "docker: Error response from daemon: manifest for node:99-alpine not found"
          # AEGIS PATTERN MATCH: "image.*not found" â category=docker
          build-args: |
            BASE_IMAGE=node:99-alpine

      - name: Push to private registry
        # BUG 18: Registry URL is fake â connection will be refused
        # ACTUAL ERROR: "Error response: connection refused" or "dial tcp: i/o timeout"
        # AEGIS PATTERN MATCH: "connection refused" â category=network
        run: |
          docker tag myorg/aegis-app:latest registry.fake-internal.corp/aegis-app:latest
          docker push registry.fake-internal.corp/aegis-app:latest

  # ââ JOB 6: vulnerability-scan ââââââââââââââââââââââââââââââââââââââââââââââââ
  # AEGIS PATTERN: docker â "image not found"
  # AEGIS PATTERN: timeout â "timed out"
  # âââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââ
  vulnerability-scan:
    continue-on-error: true
    name: Security Scan
    runs-on: ubuntu-latestt
    needs: [docker-build]
    # BUG 19: timeout is too low (1 minute) â Trivy scan always times out
    # ACTUAL ERROR: "The operation was canceled" / "timed out"
    # AEGIS PATTERN MATCH: "timed out" â category=timeout
    timeout-minutes: 1

    steps:
      - uses: actions/checkout@v4

      - name: Pull image to scan
        # BUG 20: The image was never actually pushed (docker job failed)
        # ACTUAL ERROR: "Error response from daemon: manifest ... not found"
        # AEGIS PATTERN MATCH: "image.*not found" â category=docker
        run: docker pull myorg/aegis-app:latest

      - name: Run Trivy scanner
        # BUG 21: Non-existent Trivy action version
        uses: aquasecurity/trivy-action@v99.0.0
        with:
          image-ref: myorg/aegis-app:latest
          format: sarif
          output: trivy-results.sarif
          # BUG 22: timeout too short â enforces the timeout-minutes bug
          timeout: 30s

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          # BUG 23: File won't exist because scan timed out / failed
          sarif_file: trivy-results.sarif

  # ââ JOB 7: release ââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââ
  # AEGIS PATTERN: auth â "permission denied" / "403 Forbidden"
  # âââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââ
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latestt
    needs: [vulnerability-scan]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Generate release notes
        # BUG 24: git-cliff not installed
        # ACTUAL ERROR: "sh: 1: git-cliff: not found" â "command not found"
        run: git-cliff --output CHANGELOG.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
          files: dist/**
          # BUG 25: Wrong token scope â GITHUB_TOKEN lacks write:packages permission
          # ACTUAL ERROR: "HttpError: Resource not accessible by integration â 403"
          # AEGIS PATTERN MATCH: "403" / "forbidden" â category=auth
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          # BUG 26: Undefined secret â release signing key not configured
          # Further auth failure
          RELEASE_SIGN_KEY: ${{ secrets.RELEASE_SIGN_KEY }}
